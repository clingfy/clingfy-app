name: Release - macOS production

# PHASE C of the Azure Pipelines -> GitHub Actions release migration.
# GitHub counterpart of azure-pipelines/release-prod.yml.
#
# This is the lane that ships to real users. Three independent gates stand in
# front of it, matching the Azure lane and adding one:
#
#   1. Manual dispatch only. There is no push trigger, as with `trigger: none`.
#   2. The job refuses to run unless the ref is a release/* branch, and
#      00_version_guard.sh separately ties that branch name to pubspec's semver.
#   3. The `production` GitHub Environment, which scopes the AWS OIDC token's
#      `sub` and holds ENV_PROD_B64 plus the Apple secrets.
#
#      WARNING: it is NOT currently a reviewer gate. Verified 2026-09-15,
#      `gh api repos/clingfy/clingfy-app/environments` returns NOTHING -- this
#      repo has no environments at all, so GitHub auto-creates `production`
#      unprotected on first use. An earlier version of this comment claimed a
#      "required reviewer must approve the run" and called that "what keeps a
#      public repo's release lane safe". That was never true. Required reviewers
#      ARE free on a public repo, so turning one on is worth doing; until then
#      the real restrictions are (1), (2), and the AWS role's trust policy, which
#      pins this workflow file AND a release/* ref and grants no delete.
#
# Do not enable this before the dev lanes (Phases A and B) have run green
# repeatedly and a GitHub-built app has been compared against an Azure-built one.

on:
  workflow_dispatch:
    inputs:
      allow_overwrite:
        description: "Overwrite an existing published version (dangerous)"
        type: boolean
        default: false

concurrency:
  group: release-macos-prod
  cancel-in-progress: false

permissions:
  id-token: write
  contents: write   # 06_git_tag.sh pushes the release tag

env:
  APP_ENV: prod
  RELEASE_CHANNEL: prod
  BUILD_SOURCEBRANCH: ${{ github.ref }}
  BUILD_SOURCEBRANCHNAME: ${{ github.ref_name }}
  BUILD_BUILDID: ${{ github.run_id }}

jobs:
  build-sign-publish:
    name: Build, notarize, publish, tag
    runs-on: macos-latest
    timeout-minutes: 150
    # Belt and braces with 00_version_guard.sh: a manual run from develop can
    # never publish production.
    if: startsWith(github.ref, 'refs/heads/release/')
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Xcode and Swift
        run: |
          xcodebuild -version
          swift --version

      - name: Make release scripts executable
        run: find ops/release -type f -name "*.sh" -exec chmod +x {} +

      - name: Stage .env.prod
        env:
          ENV_PROD_B64: ${{ secrets.ENV_PROD_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${ENV_PROD_B64:-}" ]; then
            echo "::error::Secret ENV_PROD_B64 is not set on the production environment."
            exit 1
          fi
          printf '%s' "$ENV_PROD_B64" | base64 -d > .env.prod
          test -s .env.prod
          echo "Staged .env.prod"

      - name: Resolve version and build number
        env:
          # Sparkle compares this number across PRODUCTION releases. The Azure
          # lane used the org-wide $(Build.BuildId), which had reached 776 on the
          # live prod appcast by 2026-08-06. A lower number means every installed
          # copy ignores the update. Raise, never lower.
          MACOS_PROD_BUILD_SEED: "1000"
        run: |
          set -euo pipefail

          VERSION_LINE="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          APP_VERSION="${VERSION_LINE%%+*}"
          CANDIDATE=$(( GITHUB_RUN_NUMBER + MACOS_PROD_BUILD_SEED ))

          # Was reading AZ_CDN_ENDPOINT straight out of .env.prod. That endpoint is the Azure CDN,
          # whose feed has been frozen since the 2026-08-17 cutover — so the "live" baseline this
          # check compared against was a snapshot that can no longer move, and the guard would go
          # on passing no matter what prod actually advertises. FEED_URL is provider-aware
          # (configure_public_endpoint), so it names whichever feed is really being served.
          source ./ops/release/_config.sh
          PUBLISHED=""
          if [ -n "${FEED_URL:-}" ]; then
            echo "Reading the published build number from ${FEED_URL}"
            PUBLISHED="$(curl -fsS --max-time 30 "$FEED_URL" 2>/dev/null \
              | grep -o '<sparkle:version>[0-9]*' \
              | grep -o '[0-9]*' | sort -n | tail -1 || true)"
          fi

          if [ -n "$PUBLISHED" ]; then
            echo "Live prod appcast advertises build $PUBLISHED"
            if [ "$CANDIDATE" -le "$PUBLISHED" ]; then
              echo "::error::Computed build number $CANDIDATE is not greater than the published $PUBLISHED. Every installed copy would ignore this release. Raise MACOS_PROD_BUILD_SEED above $(( PUBLISHED - GITHUB_RUN_NUMBER )) in this workflow."
              exit 1
            fi
          else
            echo "::warning::Could not read the live prod appcast; skipping the monotonicity check."
          fi

          echo "Resolved prod version: ${APP_VERSION}+${CANDIDATE}"
          {
            echo "APP_VERSION=$APP_VERSION"
            echo "BUILD_NUMBER=$CANDIDATE"
            echo "BUILD_NUMBER_OVERRIDE=$CANDIDATE"
          } >> "$GITHUB_ENV"

      # Was `azure/login@v2`. Both Azure release storage accounts were DELETED on 2026-09-15, and
      # #492/#494 repointed every publish path at S3, so an Azure login now authenticates to nothing
      # and every `aws` call in the lane below had no credentials at all. Measured before this
      # change: 0 aws-credential steps across all four release lanes.
      #
      # The role is publish-only by construction — no s3:DeleteObject — and its trust policy pins
      # both this workflow file and a `release/*` ref. See infra/aws/desktop-release-oidc.tf in
      # clingfy-labs for the full threat model, which is NOT the same as that repo's own deploy role
      # because this repository is public.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-1' }}
          role-session-name: clingfy-release-macos-prod-${{ github.run_id }}

      - name: "Step 0: Restore prod release history"
        run: ./ops/release/00_restore_history.sh

      - name: "Step 0.2: Version guard (branch <-> pubspec)"
        run: ./ops/release/00_version_guard.sh

      - name: "Step 0.5: Overwrite guard (prod version not already published)"
        env:
          # The Azure lane kept ALLOW_OVERWRITE in a variable group and reached
          # back into the ADO API to reset it to false after a run, so the escape
          # hatch could not be left switched on. A workflow_dispatch input is
          # single-use by construction: it applies to one run and cannot persist.
          # That reset logic is deliberately not ported.
          ALLOW_OVERWRITE: ${{ inputs.allow_overwrite }}
        run: |
          set -euo pipefail
          source ./ops/release/_config.sh

          EXPECTED_BLOB="${AZ_BINARIES_FOLDER}/${FINAL_DMG_NAME}"
          echo "Checking ${RELEASE_STORAGE_PROVIDER} store for: ${AZ_CONTAINER}/${EXPECTED_BLOB}"

          # Was hardcoded to `az storage blob exists` against AZ_STORAGE_ACCOUNT. With
          # RELEASE_STORAGE_PROVIDER=aws that asked a store nothing publishes to, so it answered
          # "not published" for every version and waved through the exact overwrite it exists to
          # block. Route it through the same seam the publish step uses.
          PROBE=0
          publish_object_exists "$AZ_CONTAINER" "$EXPECTED_BLOB" || PROBE=$?

          # A guard that cannot read its store has not passed, it has failed to run. Reporting
          # "not published" here would let an overwrite through on a credentials error.
          if [ "$PROBE" = "2" ]; then
            echo "::error::Overwrite guard could not read ${AZ_CONTAINER}/${EXPECTED_BLOB} from the ${RELEASE_STORAGE_PROVIDER} store. Not treating an unreadable store as an unpublished version."
            exit 1
          fi

          if [ "$PROBE" = "0" ]; then
            if [ "${ALLOW_OVERWRITE:-false}" = "true" ]; then
              echo "::warning::Version ${APP_VERSION} already exists at ${EXPECTED_BLOB}; overwriting because allow_overwrite was set for this run."
            else
              echo "::error::Version ${APP_VERSION} already exists at ${EXPECTED_BLOB}. Re-run with allow_overwrite if that is intended."
              exit 1
            fi
          else
            echo "Version does not exist yet. Proceeding."
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.1
          channel: stable

      # Was `brew install --cask sparkle`. Homebrew DISABLED that cask on 2026-09-01
      # ("Cask 'sparkle' has been disabled because it does not pass the macOS Gatekeeper
      # check!"), so the step fails outright — observed in run 35094504373. Nothing to do
      # with this project; the same line breaks the Azure DevOps lanes identically, which
      # means the macOS release path has been unusable since that date.
      #
      # Install from Sparkle's own signed release tarball instead, which is what the cask
      # wrapped anyway. Pinned by version AND sha256 — this toolchain signs what every
      # installed Mac will accept as an update, so an unpinned download is not acceptable
      # here even over HTTPS.
      #
      # 2.9.6 rather than the newest (2.10.0, released 3 days before this change): the app
      # pins Sparkle upToNextMajorVersion from 2.8.1, so any 2.x works, and a settled
      # release is the right call in a signing path.
      #
      # BinaryDelta is installed alongside: generate_appcast shells out to it to build the
      # delta updates, and expects to find it next to itself.
      - name: Install Sparkle tools
        run: |
          set -euo pipefail
          VER=2.9.6
          SHA=52bf9e88cdd972fc0c81501377a880e90d47031bd8ca5462488f843e2609e192
          curl -fsSL -o /tmp/Sparkle.tar.xz             "https://github.com/sparkle-project/Sparkle/releases/download/${VER}/Sparkle-${VER}.tar.xz"
          echo "${SHA}  /tmp/Sparkle.tar.xz" | shasum -a 256 -c -
          mkdir -p /tmp/sparkle
          tar -xJf /tmp/Sparkle.tar.xz -C /tmp/sparkle
          for T in generate_appcast sign_update BinaryDelta generate_keys; do
            sudo install -m 0755 "/tmp/sparkle/bin/$T" "/usr/local/bin/$T"
          done
          # lib/sparkle.sh looks in /usr/local/bin first, so this needs no resolver change.
          command -v generate_appcast

      - name: Install create-dmg
        run: |
          if command -v create-dmg >/dev/null 2>&1; then
            echo "create-dmg already installed"
          else
            brew install create-dmg
          fi

      - name: Install Apple signing material
        id: signing
        uses: ./.github/actions/apple-signing
        with:
          certificate-p12-base64: ${{ secrets.APPLE_CERT_P12_B64 }}
          certificate-password: ${{ secrets.APPLE_CERT_PASSWORD }}
          provisioning-profile-base64: ${{ secrets.APPLE_PROFILE_PROD_B64 }}

      - name: Stage notary and Sparkle keys
        env:
          APPLE_NOTARY_KEY_B64: ${{ secrets.APPLE_NOTARY_KEY_B64 }}
          SPARKLE_KEY_B64: ${{ secrets.SPARKLE_KEY_B64 }}
        run: |
          set -euo pipefail
          printf '%s' "$APPLE_NOTARY_KEY_B64" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$SPARKLE_KEY_B64"      | base64 -d > "$RUNNER_TEMP/SparkleKey"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/SparkleKey"
          test -s "$RUNNER_TEMP/AuthKey.p8" || { echo "::error::APPLE_NOTARY_KEY_B64 decoded empty"; exit 1; }
          test -s "$RUNNER_TEMP/SparkleKey" || { echo "::error::SPARKLE_KEY_B64 decoded empty"; exit 1; }
          {
            echo "NOTARY_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"
            echo "SPARKLE_KEY_PATH=$RUNNER_TEMP/SparkleKey"
          } >> "$GITHUB_ENV"

      - name: "Step 1: Build and archive"
        run: ./ops/release/01_build.sh

      - name: "Step 2: Create DMG"
        run: ./ops/release/02_create_dmg.sh

      - name: "Step 3: Notarize"
        run: ./ops/release/03_notarize.sh

      - name: "Step 4: Staple and verify"
        run: ./ops/release/04_finish.sh

      - name: Signing evidence
        run: |
          # DIAGNOSTIC, NOT A GATE — see the fuller note in release-macos-dev.yml. The real
          # gates are Step 3 (notarize) and Step 4 (staple and verify). `set +e` alone does
          # NOT make a step non-fatal: the script still exits with its LAST command's status,
          # which failed the dev lane in run 35104852578 (exit 65). Hence the explicit exit 0.
          set +e
          APP="build/macos/Build/Products/Release/Clingfy.app"
          [ -d "$APP" ] || APP="$(find build/macos -maxdepth 6 -name '*.app' -type d | head -1)"
          echo "Inspecting: $APP"
          codesign -dvvv "$APP" 2>&1
          echo "---"
          spctl -a -vvv -t exec "$APP" 2>&1
          echo "---"
          # The DMG is what staple_and_verify.sh staples; stapling a DMG does not staple the
          # .app inside it, so validating the .app reports "no ticket" for a correctly
          # notarized build.
          DMG="$(find dist -maxdepth 2 -name '*.dmg' -type f 2>/dev/null | head -1)"
          if [ -n "$DMG" ]; then
            echo "Stapler target: $DMG"
            xcrun stapler validate "$DMG" 2>&1
          else
            echo "No DMG found under dist/ to validate."
          fi
          exit 0

      - name: Re-authenticate to AWS before publishing
        # See the note in release-macos-dev.yml. Same reason as the Azure step this replaces, for a
        # different credential: notarization alone can take longer than the session.
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-1' }}
          role-session-name: clingfy-publish-macos-prod-${{ github.run_id }}

      - name: "Step 5: Publish release"
        run: ./ops/release/05_publish.sh

      - name: "Step 6: Create git tag"
        # Immediately after publish, before anything cosmetic. Step 5 is what
        # makes the release real -- the DMG is on the CDN and the appcast serves
        # it -- so every step between publish and tag is a window where users are
        # offered an update the repo has no tag for. That window fired on 1.0.7
        # when the Telegram notifier returned HTTP 400 and stopped the job.
        run: ./ops/release/06_git_tag.sh

      - name: Upload dist artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Clingfy-Release
          path: dist
          if-no-files-found: warn

      - name: Notify Telegram (success)
        if: success()
        run: ./ops/release/notify_telegram.sh success

      - name: Notify Telegram (failure)
        if: failure()
        run: ./ops/release/notify_telegram.sh failure

      - name: Delete signing keychain
        if: always()
        run: |
          if [ -n "${CLINGFY_SIGNING_KEYCHAIN:-}" ] && [ -f "$CLINGFY_SIGNING_KEYCHAIN" ]; then
            security delete-keychain "$CLINGFY_SIGNING_KEYCHAIN" || true
            echo "Deleted $CLINGFY_SIGNING_KEYCHAIN"
          fi
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/SparkleKey" || true
