name: "Install Apple signing material"
description: >
  Hand-rolled replacement for Azure Pipelines' InstallAppleCertificate@2 and
  InstallAppleProvisioningProfile@1, neither of which has a GitHub equivalent.
  Imports the Developer ID certificate into a throwaway keychain, installs the
  provisioning profile, and exports the four variables the release scripts read.

# WHY THIS EXISTS, AND WHY IT FAILS LOUDLY
#
# The ADO tasks did three things this has to reproduce by hand:
#
#   1. Create a temporary keychain, import the .p12, unlock it, and make it the
#      default so `xcodebuild archive` and `codesign` can find the identity.
#   2. Copy the provisioning profile where Xcode looks for it.
#   3. Emit output variables that later steps consume --
#      InstallProfile.provisioningProfileUuid and .provisioningProfileName.
#
# The dangerous part is (3) combined with how codesign behaves. A missing or
# wrong identity does NOT fail the build: codesign silently picks another
# identity or ad-hoc signs, the .app and .dmg are produced, and the failure only
# surfaces minutes later when notarization rejects the upload -- or, worse, does
# not surface at all because the artifact was signed by the wrong team.
#
# So every lookup here is asserted. If the identity is missing, if more than one
# matches, or if the certificate's team does not match APPLE_TEAM_ID, this step
# fails before a single line is compiled. A red step here costs two minutes; a
# wrongly-signed release costs a release window.

inputs:
  certificate-p12-base64:
    description: "Base64 of the Developer ID .p12 (secret APPLE_CERT_P12_B64)"
    required: true
  certificate-password:
    description: "Password protecting the .p12 (secret APPLE_CERT_PASSWORD)"
    required: true
  provisioning-profile-base64:
    description: "Base64 of the .mobileprovision for this channel"
    required: true
  expected-team-id:
    description: "Apple team the certificate must belong to. Empty disables the check."
    required: false
    default: "46LWU2HLR5"

outputs:
  keychain-path:
    description: "Keychain created by this action, for the cleanup step to delete"
    value: ${{ steps.keychain.outputs.keychain-path }}
  provisioning-profile-uuid:
    description: "UUID decoded from the profile (was InstallProfile.provisioningProfileUuid)"
    value: ${{ steps.profile.outputs.uuid }}
  provisioning-profile-name:
    description: "Name decoded from the profile (was InstallProfile.provisioningProfileName)"
    value: ${{ steps.profile.outputs.name }}

runs:
  using: composite
  steps:
    - name: Import certificate into a throwaway keychain
      id: keychain
      shell: bash
      env:
        CERT_P12_B64: ${{ inputs.certificate-p12-base64 }}
        CERT_PASSWORD: ${{ inputs.certificate-password }}
        EXPECTED_TEAM_ID: ${{ inputs.expected-team-id }}
      run: |
        set -euo pipefail

        KEYCHAIN="$RUNNER_TEMP/clingfy-signing.keychain-db"
        P12_PATH="$RUNNER_TEMP/certificate.p12"

        # Random per-run password. It never leaves the runner and the keychain is
        # deleted in the cleanup step, so it is not worth a repository secret.
        KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
        echo "::add-mask::$KEYCHAIN_PASSWORD"

        printf '%s' "$CERT_P12_B64" | base64 -d > "$P12_PATH"
        if [ ! -s "$P12_PATH" ]; then
          echo "::error::APPLE_CERT_P12_B64 decoded to an empty file. Re-encode with 'base64 -i Certificates.p12 | pbcopy' and update the secret."
          exit 1
        fi

        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
        # -lut 21600: do not auto-lock for 6h. The default locks after a few
        # minutes of inactivity, which turns a slow notarization wait into a
        # codesign failure on the step after it.
        security set-keychain-settings -lut 21600 "$KEYCHAIN"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

        # Prepend to the search list rather than replacing it: xcodebuild still
        # needs the login keychain for other lookups.
        security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
        security default-keychain -s "$KEYCHAIN"

        security import "$P12_PATH" \
          -k "$KEYCHAIN" \
          -P "$CERT_PASSWORD" \
          -f pkcs12 \
          -T /usr/bin/codesign \
          -T /usr/bin/security \
          -T /usr/bin/productbuild

        # Without this, codesign blocks on a GUI keychain-access prompt that
        # nobody can answer on a headless runner, and the job hangs to timeout.
        security set-key-partition-list \
          -S apple-tool:,apple:,codesign: \
          -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null

        rm -f "$P12_PATH"

        IDENTITIES="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep "Developer ID Application" || true)"
        COUNT="$(printf '%s' "$IDENTITIES" | grep -c . || true)"

        if [ "$COUNT" -eq 0 ]; then
          echo "::error::No 'Developer ID Application' identity in the imported certificate. codesign would fall back to ad-hoc signing and notarization would reject the build."
          security find-identity -v -p codesigning "$KEYCHAIN" || true
          exit 1
        fi
        if [ "$COUNT" -gt 1 ]; then
          echo "::error::$COUNT 'Developer ID Application' identities found; the signed team would be ambiguous. Ship a .p12 containing exactly one."
          printf '%s\n' "$IDENTITIES"
          exit 1
        fi

        CERT_HASH="$(printf '%s' "$IDENTITIES" | awk '{print $2}')"
        SIGNING_IDENTITY="$(printf '%s' "$IDENTITIES" | sed -E 's/.*"(.*)".*/\1/')"

        if [ -n "$EXPECTED_TEAM_ID" ] && ! printf '%s' "$SIGNING_IDENTITY" | grep -q "($EXPECTED_TEAM_ID)"; then
          echo "::error::Certificate is '$SIGNING_IDENTITY' but this lane expects team $EXPECTED_TEAM_ID. Signing with the wrong team produces an app that notarizes but is not yours."
          exit 1
        fi

        echo "Signing identity: $SIGNING_IDENTITY"
        echo "Certificate SHA-1: $CERT_HASH"

        # create_dmg.sh prefers CERT_HASH and falls back to the identity string;
        # both are exported so either path resolves.
        {
          echo "CERT_HASH=$CERT_HASH"
          echo "APPLE_CERTIFICATE_SIGNING_IDENTITY=$SIGNING_IDENTITY"
          echo "CLINGFY_SIGNING_KEYCHAIN=$KEYCHAIN"
        } >> "$GITHUB_ENV"

        echo "keychain-path=$KEYCHAIN" >> "$GITHUB_OUTPUT"

    - name: Install provisioning profile
      id: profile
      shell: bash
      env:
        PROFILE_B64: ${{ inputs.provisioning-profile-base64 }}
      run: |
        set -euo pipefail

        PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
        printf '%s' "$PROFILE_B64" | base64 -d > "$PROFILE_PATH"
        if [ ! -s "$PROFILE_PATH" ]; then
          echo "::error::The provisioning-profile secret decoded to an empty file."
          exit 1
        fi

        # A .mobileprovision is a CMS-signed plist. This is the same pair of
        # values InstallAppleProvisioningProfile@1 published as output variables;
        # 01_build.sh consumes both to write ExportOptions.plist.
        security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
        UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")"
        NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")"

        if [ -z "$UUID" ] || [ -z "$NAME" ]; then
          echo "::error::Could not read UUID/Name out of the provisioning profile."
          exit 1
        fi

        PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
        mkdir -p "$PROFILE_DIR"
        # Xcode resolves by UUID; ops/release/lib/apple.sh
        # (resolve_local_provisioning_profile_path) looks for the specifier name
        # first and the UUID second. Install both names so either path finds it.
        cp "$PROFILE_PATH" "$PROFILE_DIR/$UUID.provisionprofile"
        cp "$PROFILE_PATH" "$PROFILE_DIR/$NAME.provisionprofile"

        echo "Provisioning profile: $NAME ($UUID)"
        /usr/libexec/PlistBuddy -c 'Print :ExpirationDate' "$RUNNER_TEMP/profile.plist" || true

        {
          echo "APPLE_PROV_PROFILE_UUID=$UUID"
          echo "APPLE_PROV_PROFILE_SPECIFIER=$NAME"
        } >> "$GITHUB_ENV"

        echo "uuid=$UUID" >> "$GITHUB_OUTPUT"
        echo "name=$NAME" >> "$GITHUB_OUTPUT"

        rm -f "$RUNNER_TEMP/profile.plist"
